services:
  api:
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      - CHOKIDAR_USEPOLLING=true
      # DATABASE_URL must be explicit so Prisma has it in process.env before ConfigModule loads
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # NODE_ENV needed early (before ConfigModule) so ts-node/NestJS boot correctly
      - NODE_ENV=development
      # All other vars (JWT secrets, CORS, cookies, etc.) are read from .env on disk
      # by NestJS ConfigModule at each process start — no container restart needed
    volumes:
      - .:/usr/share/app
    ports:
      - 3000:3000
    expose:
      - 3000
    depends_on:
      - db
    tty: true
    stdin_open: true

  db:
    restart: always
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  mailhog:
    image: mailhog/mailhog:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP (app s sends here)
      - "8025:8025" # Web UI — http://localhost:8025

volumes:
  pgdata:
